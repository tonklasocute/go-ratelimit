# Two app instances share one Redis. k6 sends 60 req/s for 10s with one API
# key, split evenly across both instances; the shared limit is 20 req/s, so
# about 200 (+ the burst of 20) succeed in total, not 200 per instance.
#
#   docker compose -f examples/distributed/docker-compose.yml up --build --abort-on-container-exit k6
services:
  redis:
    image: redis:7-alpine
  app1:
    build: { context: ../.., dockerfile: examples/distributed/Dockerfile }
    environment: { INSTANCE: app1, REDIS_ADDR: "redis:6379" }
    depends_on: [redis]
  app2:
    build: { context: ../.., dockerfile: examples/distributed/Dockerfile }
    environment: { INSTANCE: app2, REDIS_ADDR: "redis:6379" }
    depends_on: [redis]
  k6:
    image: grafana/k6:1.3.0
    command: run /scripts/load.js
    volumes: ["./load.js:/scripts/load.js:ro"]
    depends_on: [app1, app2]
