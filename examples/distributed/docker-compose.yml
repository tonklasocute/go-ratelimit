# Two app instances share one Redis. k6 sends 60 req/s for 20s with one API
# key, alternating between the instances; the shared limit is 20 req/s with
# a burst of 20, so about 420 requests succeed in total, not 420 per instance.
#
#   docker compose -f examples/distributed/docker-compose.yml up --build --abort-on-container-exit --exit-code-from k6 k6
#   examples/distributed/per-second.sh   # allowed requests per second, per instance
services:
  redis:
    image: redis:7-alpine
  app1:
    build: { context: ../.., dockerfile: examples/distributed/Dockerfile }
    environment: { INSTANCE: app1, REDIS_ADDR: "redis:6379" }
    depends_on: [redis]
  app2:
    build: { context: ../.., dockerfile: examples/distributed/Dockerfile }
    environment: { INSTANCE: app2, REDIS_ADDR: "redis:6379" }
    depends_on: [redis]
  k6:
    image: grafana/k6:1.3.0
    command: run --quiet --out csv=/results/k6.csv /scripts/load.js
    volumes:
      - ./load.js:/scripts/load.js:ro
      - ./results:/results
    depends_on: [app1, app2]
