version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Writing a response body after headers are sent has no useful
        # error handling.
        - (net/http.ResponseWriter).Write
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Tests may ignore errors from calls whose outcome they assert later.
      - path: _test\.go
        linters: [errcheck, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tonklasocute/go-ratelimit
